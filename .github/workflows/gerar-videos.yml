name: Gerar videos

on:
  workflow_dispatch: {}
  push:
    paths: ["motor/**"]

permissions:
  contents: write

concurrency:
  group: gerar-videos
  cancel-in-progress: false

jobs:
  vozes:
    runs-on: ubuntu-24.04
    outputs:
      lista: ${{ steps.lista.outputs.lista }}
    steps:
      - uses: actions/checkout@v4
      - name: Gerar vozes que faltam (ElevenLabs)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 motor/tts.py
      - name: Salvar vozes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motor/voices
          git diff --cached --quiet || (git commit -m "Vozes novas" && git push)
      - name: Videos que faltam
        id: lista
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os
          fila = json.load(open("motor/fila.json"))
          ids = [f["id"] for f in fila if not os.path.exists(f"videos/{f['id']}.mp4") and os.path.exists(f"motor/voices/{f['id']}.mp3")]
          print("lista=" + json.dumps(ids))
          PY

  render:
    needs: vozes
    if: needs.vozes.outputs.lista != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJson(needs.vozes.outputs.lista) }}
        parte: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Instalar dependencias
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          which ffmpeg || NEED=ffmpeg
          sudo apt-get install -y -qq --no-install-recommends $NEED python3-cairo python3-numpy python3-pil > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends $NEED python3-cairo python3-numpy python3-pil > /dev/null)
          sudo mkdir -p /usr/share/fonts/opentype/inter /usr/share/fonts/opentype/noto
          sudo cp motor/fonts/Inter-*.otf /usr/share/fonts/opentype/inter/
          sudo cp motor/fonts/NotoSerifCJK-Bold.ttc /usr/share/fonts/opentype/noto/
          sudo fc-cache -f > /dev/null
      - name: Renderizar parte das cenas
        env:
          STORY: ${{ matrix.id }}
          BIBLIA_BASE: ${{ github.workspace }}/motor
        run: |
          cd motor
          KS=$(/usr/bin/python3 -c "import davi; n=len(davi.SCENES); print(' '.join(str(k) for k in range(n) if k % 5 == ${{ matrix.parte }}))" | tail -1)
          echo "cenas: $KS"
          [ -z "$KS" ] || /usr/bin/python3 davi.py render $KS
      - uses: actions/upload-artifact@v4
        with:
          name: cenas-${{ matrix.id }}-${{ matrix.parte }}
          path: motor/out_${{ matrix.id }}/s*.mp4
          if-no-files-found: ignore

  montar:
    needs: [vozes, render]
    if: needs.vozes.outputs.lista != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJson(needs.vozes.outputs.lista) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Instalar dependencias
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          which ffmpeg || NEED=ffmpeg
          sudo apt-get install -y -qq --no-install-recommends $NEED python3-cairo python3-numpy python3-pil > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends $NEED python3-cairo python3-numpy python3-pil > /dev/null)
      - uses: actions/download-artifact@v4
        with:
          path: motor/out_${{ matrix.id }}
          pattern: cenas-${{ matrix.id }}-*
          merge-multiple: true
      - name: Trilha, mixagem e video final
        env:
          STORY: ${{ matrix.id }}
          SKIP_RENDER: "1"
        run: cd motor && ls out_$STORY && PATH=/usr/bin:$PATH ./fazer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.id }}
          path: motor/final/${{ matrix.id }}.mp4

  publicar:
    needs: montar
    if: always() && needs.montar.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: novos
          pattern: video-*
          merge-multiple: true
      - name: Guardar videos e agendar
        run: |
          mkdir -p videos && cp novos/*.mp4 videos/ 2>/dev/null || true
          python3 motor/agendar.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos instagram/agenda.json
          git diff --cached --quiet || (git commit -m "Videos novos e agenda" && git pull --rebase -q && git push)
