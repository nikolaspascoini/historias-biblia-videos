name: Postar no Instagram

on:
  push:
    paths: ["instagram/teste.txt"]   # mexer nesse arquivo roda um teste de conexao
  schedule:
    - cron: "*/15 * * * *"   # confere a agenda a cada 15 minutos
  workflow_dispatch:
    inputs:
      testar:
        description: "So testar a conexao (nao posta nada)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Publicar posts na hora
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TESTAR: ${{ github.event_name == 'push' || inputs.testar }}
        run: python3 instagram/postar.py
      - name: Salvar o que foi publicado
        if: always()
        run: |
          if ! git diff --quiet instagram/agenda.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add instagram/agenda.json
            git commit -m "Instagram: agenda atualizada"
            git push
          fi
